<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="鎖匙管理"><meta name="format-detection" content="telephone=no"><meta name="description" content="設施助理鎖匙借用管理工具"><title>鎖匙借用管理</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="ios.css"><link rel="stylesheet" href="cloud.css"><style>.purpose-editor{width:100%;min-height:47px}.purpose-editor input{height:auto!important;border:0!important;padding:6px!important;min-width:180px}.purpose-list{display:flex!important;flex-wrap:wrap;gap:5px}.block-name{color:#159e82;margin-left:5px}.purpose-label{display:flex;flex-direction:column;gap:7px}.key-symbol{position:relative;width:25px;height:25px;border:4px solid #102a43;border-radius:50%}.key-symbol:after{content:"";position:absolute;width:18px;height:5px;left:17px;top:15px;background:#102a43;border-radius:0 3px 3px 0;box-shadow:8px 5px 0 -1px #102a43}.brand-mark{background:linear-gradient(145deg,#7ae0c9,#25b394);transform:rotate(-8deg)}.brand-mark .key-symbol{transform:rotate(8deg)}</style></head><body>
<section class="auth-screen" id="authScreen"><div class="auth-card"><div class="auth-logo"><span class="key-symbol"></span></div><p class="eyebrow">雲端鎖匙管理</p><h1>登入管理系統</h1><p class="auth-copy">登入後可在手機及電腦同步鎖匙紀錄。</p><form id="authForm"><label>電郵地址<input id="authEmail" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>密碼<input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="至少 6 個字元"></label><p class="auth-message" id="authMessage" aria-live="polite"></p><button class="btn btn-primary" type="submit" id="signInBtn">登入</button><button class="btn btn-ghost" type="button" id="signUpBtn">首次使用：建立帳戶</button></form><p class="auth-note">只有已獲批准的電郵帳戶可以存取鎖匙紀錄。</p></div></section>
<div id="appShell" hidden><header class="topbar"><div class="brand-mark" aria-hidden="true"><span class="key-symbol"></span></div><div><p class="eyebrow">設施管理</p><h1>鎖匙借用管理</h1></div><div class="account-area"><span id="userEmail"></span><button class="btn btn-ghost" id="signOutBtn">登出</button></div><button class="btn btn-primary add-btn" id="addKeyBtn">＋ 新增鎖匙</button></header>
<main><section class="summary" aria-label="鎖匙狀態概覽"><article><span>鎖匙總數</span><strong id="totalCount">0</strong></article><article><span>可供借用</span><strong class="available" id="availableCount">0</strong></article><article><span>已借出</span><strong class="borrowed" id="borrowedCount">0</strong></article></section><section class="sync-bar"><span class="sync-dot"></span><span id="syncStatus">已連接雲端資料庫</span></section>
<section class="toolbar"><div class="tag-search"><div class="search-tags" id="searchTags"></div><input id="searchInput" placeholder="輸入關鍵字，按 Enter 加入搜尋標籤" autocomplete="off"><button class="clear-search" id="clearSearch" type="button" hidden>清除</button></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="available">未借出</button><button class="filter" data-filter="borrowed">已借出</button></div></section><p class="search-help">可搜尋大樓、區塊、用途、顏色、編號或樓層；多個標籤須全部符合。</p><p class="result-note" id="resultNote" aria-live="polite"></p><section class="key-grid" id="keyGrid"></section><section class="empty-state" id="emptyState" hidden><div>⌕</div><h2>找不到相符鎖匙</h2><p>請移除部分搜尋標籤或更改篩選。</p></section></main></div>
<dialog id="keyDialog"><form id="keyForm" method="dialog"><div class="dialog-heading"><div><p class="eyebrow">鎖匙資料</p><h2 id="dialogTitle">新增鎖匙</h2></div><button class="icon-btn" type="button" id="closeDialogBtn">×</button></div><input type="hidden" id="keyId"><div class="form-grid"><label>掛牌顏色<select id="tagColor" required><option>黑色</option><option>粉紅色</option><option>黃色</option><option>藍色</option><option>紅色</option><option>綠色</option><option>無</option><option>其他</option></select></label><label>鎖匙編號<input id="keyNumber" required maxlength="30" placeholder="例如：113"></label><div class="wide purpose-label"><span>用途（可多選）</span><div class="tag-search purpose-editor"><div class="search-tags" id="purposeTags"></div><input id="purposeInput" maxlength="60" placeholder="輸入用途，按 Enter 加入標籤" autocomplete="off"></div><p class="field-error" id="purposeError" hidden>請加入至少一個用途標籤。</p></div><label>所屬大樓<select id="building" required><option value="">請選擇</option><option>2E</option><option>3E</option><option>5E</option><option>6E</option><option>1E</option><option>1W</option><option>5W</option></select></label><label>所屬區塊<select id="block" required><option>無</option><option>Core 1</option><option>Core 2</option></select></label><fieldset class="wide floor-field"><legend>適用樓層（可多選）</legend><div class="floor-options" id="floorOptions"></div><p class="field-error" id="floorError" hidden>請選擇至少一個樓層標籤。</p></fieldset></div><p class="form-hint">用途可加入多個標籤。「通匙」不可與其他樓層同時選擇，並可匹配任何樓層搜尋。</p><p class="field-error" id="saveError" hidden></p><div class="dialog-actions"><button class="btn btn-ghost" type="button" id="cancelBtn">取消</button><button class="btn btn-primary" type="submit" id="saveKeyBtn">儲存鎖匙</button></div></form></dialog>
<dialog class="confirm-dialog" id="confirmDialog"><form method="dialog"><h2>刪除鎖匙紀錄？</h2><p id="confirmText"></p><div class="dialog-actions"><button class="btn btn-ghost" value="cancel">取消</button><button class="btn btn-danger" value="confirm">確認刪除</button></div></form></dialog>
<template id="keyCardTemplate"><article class="key-card"><div class="card-top"><div class="key-identity"><span class="color-dot"></span><div><small><span class="building"></span><span class="block-name"></span></small><h2 class="number"></h2></div></div><span class="status-pill"></span></div><dl><div><dt>用途</dt><dd class="purpose-list"></dd></div><div><dt>適用樓層</dt><dd class="floor-list"></dd></div></dl><div class="card-actions"><button class="btn status-action"></button><button class="icon-btn edit-action">✎</button><button class="icon-btn delete-action">⌫</button></div></article></template>
<script>if(new URLSearchParams(location.search).get("view")==="manage")document.getElementById("authScreen").style.display="none";</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-20260810-3.js"></script></body></html>
