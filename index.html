<!doctype html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123047"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="設施助理巡廁記錄工具"><title>設施助理｜巡廁記錄</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23123047'/%3E%3Cpath d='M17 18h30v9H17zm4 13h22v17H21z' fill='%2359d5b5'/%3E%3Cpath d='M28 35h8v9h-8z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="toilet.css?v=20260911-1"></head><body>
<header><div class="brand"><span class="mark">巡</span><div><p class="eyebrow">設施助理</p><h1>巡廁記錄</h1></div></div><span class="cloud-state"><i></i><span id="cloudState">雲端記錄</span></span></header>
<main><form id="inspectionForm" class="panel"><div class="panel-head"><div><p class="step">新增巡查</p><h2>廁所清潔檢查</h2></div><span id="progress">0 / 10</span></div><div class="location-grid"><label>大廈<select id="building" required><option value="">請選擇</option><option>2E</option><option>3E</option><option>5E</option><option>6E</option></select></label><label id="coreLabel">區域<select id="core" required><option value="">請選擇</option><option>Core 1</option><option>Core 2</option></select></label><label>樓層<select id="floor" required><option value="">請選擇</option><option>G/F</option><option>1/F</option><option>2/F</option><option>3/F</option><option>5/F</option><option>6/F</option></select></label><label>廁所類別<select id="toiletType"><option>男廁</option><option>傷健廁</option></select></label></div><div class="section-title"><div><h3>清潔情況</h3><p>每項選擇合格或不合格</p></div><button id="markAllPass" class="mini" type="button">全部合格</button></div><div id="checklist" class="checklist"></div><label class="notes">備注（選填）<textarea id="notes" maxlength="500" placeholder="例如：已通知清潔員跟進"></textarea></label><p id="formMessage" class="message" aria-live="polite"></p><button id="submitBtn" class="primary submit" type="submit">提交巡查記錄</button></form><section class="records panel"><div class="records-head"><div><p class="step">巡查記錄</p><h2>最近記錄</h2></div><button id="refresh" class="ghost" type="button">重新整理</button></div><div id="recordList" class="record-list"></div><p id="empty" class="empty" hidden>暫時未有巡查記錄。</p></section></main>
<template id="checkTemplate"><article class="check-item"><span></span><div><button type="button" data-value="pass" aria-label="合格">✓</button><button type="button" data-value="fail" aria-label="不合格">✕</button></div></article></template><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="toilet-app-20260911-1.js"></script></body></html>
